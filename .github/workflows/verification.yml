name: Verification

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: verification-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  OPENBLAS_NUM_THREADS: "1"
  OMP_NUM_THREADS: "1"
  MKL_NUM_THREADS: "1"

jobs:
  coprime:
    name: Coprime checks (Python ${{ matrix.python }})
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        python: ["3.10", "3.13"]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: teorth/erdosproblems
          ref: 19cb6116c2c194240e8f46c973e13a161f7987b2
          path: data/erdosproblems
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: ${{ matrix.python }}
          cache: pip
          cache-dependency-path: requirements-test.txt
      - name: Install declared dependencies with tested constraints
        run: python -m pip install -c requirements-test.txt '.[test]'
      - name: Verify archived witnesses independently
        run: |
          mkdir -p test-results
          python -I -S src/verify_coprime_witnesses.py \
            docs/audits/coprime-ramsey-release-2026-10-17/witness-*.json \
            > test-results/witnesses.json
      - name: Run focused regression tests and coverage
        run: |
          python -m pytest -q \
            tests/test_coprime_evidence.py tests/test_coprime_ramsey_sat.py \
            tests/test_coprime_ramsey_variants.py tests/test_nt_graph_ramsey.py::TestRGCD \
            tests/test_synthesis.py tests/test_verify_coprime_witnesses.py \
            tests/test_coprime_perfectness_proof.py \
            tests/test_geometry_attacks.py::TestUnitDistanceCount \
            tests/test_geometry_attacks.py::TestHasDuplicatePoints \
            --timeout=120 --timeout-method=thread \
            --cov=coprime_ramsey_sat --cov=coprime_ramsey_variants \
            --cov=synthesis --cov=verify_coprime_witnesses --cov=coprime_perfectness_proof \
            --cov-report=term-missing --cov-report=xml:test-results/coverage.xml \
            --junitxml=test-results/focused.xml
      - name: Preserve verification reports
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: coprime-python-${{ matrix.python }}
          path: test-results/

  routine:
    name: Routine suite (Python 3.10)
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: teorth/erdosproblems
          ref: 19cb6116c2c194240e8f46c973e13a161f7987b2
          path: data/erdosproblems
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.10"
          cache: pip
          cache-dependency-path: requirements-test.txt
      - name: Install declared dependencies with tested constraints
        run: python -m pip install -c requirements-test.txt '.[test]'
      - name: Run all routine tests
        run: |
          mkdir -p test-results
          python -m pytest -v -m 'not slow' -n 2 --dist=loadfile \
            --timeout=120 --timeout-method=thread --durations=30 \
            --junitxml=test-results/routine.xml
      - name: Preserve routine test reports
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: routine-python-3.10
          path: test-results/
